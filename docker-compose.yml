services:
  db:
    image: postgres:16-alpine
    container_name: brewlite-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: brewlite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: brewlite-secret
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d brewlite']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:20-alpine
    container_name: brewlite-api
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npm run start:dev"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:brewlite-secret@localhost:5433/brewlite}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-me}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-alpine
    container_name: brewlite-web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
  web_next:
